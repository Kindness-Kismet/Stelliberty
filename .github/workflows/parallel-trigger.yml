name: Parallel Trigger

on:
  push:
    branches:
      - beta
    paths: &verification-paths
      - 'src/**'
      - 'native/**'
      - 'tests/**'
      - 'scripts/**'
      - '.github/scripts/**'
      - '.github/workflows/stability-verification.yml'
      - 'Directory.Build.props'
      - 'Stelliberty.slnx'
      - '**/Cargo.toml'
      - 'Cargo.lock'
      - 'global.json'
      - '**/*.csproj'
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - edited
    branches:
      - beta
    paths: *verification-paths
  workflow_dispatch:

concurrency:
  group: verification-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  validate-branch:
    name: Validate trigger branch
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-22.04
    steps:
      - name: Require beta branch
        shell: bash
        run: test "${{ github.ref }}" = 'refs/heads/beta'

  detect-beta-build-changes:
    name: Detect beta build changes
    if: github.event_name == 'push' && github.ref == 'refs/heads/beta'
    runs-on: ubuntu-22.04
    outputs:
      should_build: ${{ steps.changes.outputs.should_build }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Detect product changes
        id: changes
        shell: bash
        env:
          AFTER_SHA: ${{ github.sha }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          props_version="$(sed -n 's:.*<AppVersion>\(.*\)</AppVersion>.*:\1:p' Directory.Build.props)"
          gh api --paginate "repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
            --jq '.[] | select(.draft | not) | .tag_name' > release-tags.txt
          git tag --list > repository-tags.txt
          python scripts/beta_workflow.py metadata \
            --props-version "${props_version}" \
            --release-tags release-tags.txt \
            --repository-tags repository-tags.txt > beta-metadata.env
          source beta-metadata.env

          git fetch --force origin "refs/tags/${previous_tag}:refs/tags/${previous_tag}"
          git diff --name-only "${previous_tag}" "${AFTER_SHA}" > changed-paths.txt
          python scripts/beta_workflow.py should-build --paths changed-paths.txt > beta-build.env
          cat beta-build.env >> "$GITHUB_OUTPUT"
          source beta-build.env

          if [ "${should_build}" = true ]; then
            echo "Product changes since ${previous_tag} require a beta build."
          else
            echo "No product changes since ${previous_tag}; beta build is skipped."
          fi

  code-quality:
    name: Trigger code quality
    if: >-
      ${{
        (github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/beta') &&
        (github.event.action != 'edited' || github.event.changes.base.ref.from != null)
      }}
    uses: ./.github/workflows/code-quality.yml
    secrets: inherit

  stability-verification:
    name: Trigger test verification
    if: >-
      ${{
        (github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/beta') &&
        (github.event.action != 'edited' || github.event.changes.base.ref.from != null)
      }}
    uses: ./.github/workflows/stability-verification.yml
    secrets: inherit

  beta-build:
    name: Trigger beta build
    needs: [detect-beta-build-changes, code-quality, stability-verification]
    if: >-
      ${{
        always() &&
        needs.detect-beta-build-changes.result == 'success' &&
        needs.detect-beta-build-changes.outputs.should_build == 'true' &&
        needs.code-quality.result == 'success' &&
        needs.stability-verification.result == 'success' &&
        github.ref == 'refs/heads/beta' &&
        github.event_name == 'push'
      }}
    uses: ./.github/workflows/build-beta.yml
    secrets: inherit

  beta-build-not-required:
    name: Beta build not required
    needs: [detect-beta-build-changes, code-quality, stability-verification]
    if: >-
      ${{
        always() &&
        github.event_name == 'push' &&
        github.ref == 'refs/heads/beta' &&
        needs.detect-beta-build-changes.result == 'success' &&
        needs.detect-beta-build-changes.outputs.should_build != 'true' &&
        needs.code-quality.result == 'success' &&
        needs.stability-verification.result == 'success'
      }}
    runs-on: ubuntu-22.04
    steps:
      - name: Report intentional skip
        shell: bash
        run: |
          echo '::notice::Verification passed; no product changes require a beta build.'
          echo '### Beta Build' >> "$GITHUB_STEP_SUMMARY"
          echo 'Verification passed. The beta build was intentionally skipped because no product files changed.' >> "$GITHUB_STEP_SUMMARY"
