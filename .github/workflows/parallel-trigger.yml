name: Parallel Trigger

on:
  push:
    branches:
      - beta
    paths: &verification-paths
      - 'src/**'
      - 'native/**'
      - 'tests/**'
      - 'scripts/**'
      - 'Directory.Build.props'
      - 'Stelliberty.slnx'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'global.json'
      - '**/*.csproj'
  pull_request:
    branches:
      - beta
    paths: *verification-paths
  workflow_dispatch:

concurrency:
  group: verification-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  validate-branch:
    name: Validate trigger branch
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-22.04
    steps:
      - name: Require beta branch
        shell: bash
        run: test "${{ github.ref }}" = 'refs/heads/beta'

  code-quality:
    name: Trigger code quality
    if: github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/beta'
    uses: ./.github/workflows/code-quality.yml
    secrets: inherit

  stability-verification:
    name: Trigger test verification
    if: github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/beta'
    uses: ./.github/workflows/stability-verification.yml
    secrets: inherit

  beta-build:
    name: Trigger beta build
    needs: [code-quality, stability-verification]
    if: >-
      ${{
        needs.code-quality.result == 'success' &&
        needs.stability-verification.result == 'success' &&
        github.ref == 'refs/heads/beta' &&
        (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
      }}
    uses: ./.github/workflows/build-beta.yml
    secrets: inherit
