name: Runner Version Upgrade

on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    name: Update workflow runners
    runs-on: ubuntu-26.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          ref: beta
          token: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Update runner labels
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const response = await fetch('https://raw.githubusercontent.com/actions/runner-images/main/README.md');
            if (!response.ok) {
              core.setFailed('Unable to download runner labels: ' + response.status);
              return;
            }

            const readme = await response.text();
            const available = [...readme.matchAll(/`(ubuntu-\d+\.\d+(?:-arm)?)`/g)].map(match => match[1]);
            const latest = current => {
              const expression = current.endsWith('-arm')
                ? /^ubuntu-(\d+)\.(\d+)-arm$/
                : /^ubuntu-(\d+)\.(\d+)$/;
              const candidates = available
                .map(label => ({ label, match: label.match(expression) }))
                .filter(item => item.match)
                .sort((left, right) => Number(right.match[1]) - Number(left.match[1]) || Number(right.match[2]) - Number(left.match[2]));
              return candidates[0]?.label ?? current;
            };

            for (const file of fs.readdirSync('.github/workflows').filter(file => /\.ya?ml$/.test(file))) {
              const filePath = path.join('.github/workflows', file);
              const original = fs.readFileSync(filePath, 'utf8');
              const updated = original.replace(/((?:runs-on|runner):\s*)(ubuntu-\d+\.\d+(?:-arm)?)/g, (_, prefix, label) => prefix + latest(label));
              if (updated !== original) {
                fs.writeFileSync(filePath, updated);
                core.info('Updated ' + filePath);
              }
            }

      - name: Open runner upgrade pull request
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
          base: beta
          branch: automation/runner-version-upgrade
          delete-branch: true
          commit-message: Upgrade GitHub Actions runner versions
          title: Upgrade GitHub Actions runner versions
          body: |
            Automated update of GitHub Actions runner labels to supported versions.
